map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

proxy_cache_path /var/cache/nginx/sogo
    levels=1:2
    keys_zone=sogo_static:32m
    max_size=2g
    inactive=30d
    use_temp_path=off;

log_format edge_timing '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                       'request_time=$request_time upstream_time=$upstream_response_time '
                       'cache=$upstream_cache_status forwarded_for="$http_x_forwarded_for"';

server {
    listen 8080;
    server_name _;
    client_max_body_size 0;
    access_log /var/log/nginx/access.log edge_timing;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    location ^~ /SOGo.woa/WebServerResources/ {
        proxy_pass http://frps:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";

        proxy_cache sogo_static;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        expires 7d;
        add_header X-Infotech-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://frps:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
