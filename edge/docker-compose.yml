services:
  web-edge:
    image: nginx:1.29.0-alpine
    restart: unless-stopped
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          --header='Host: mail.infotech.wiki'
          --header='X-Forwarded-Proto: https'
          http://127.0.0.1:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.infotech-mail-web.rule=Host(`mail.infotech.wiki`)"
      - "traefik.http.routers.infotech-mail-web.entrypoints=web"
      - "traefik.http.routers.infotech-mail-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.infotech-mail-websecure.rule=Host(`mail.infotech.wiki`)"
      - "traefik.http.routers.infotech-mail-websecure.entrypoints=websecure"
      - "traefik.http.routers.infotech-mail-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.infotech-mail.loadbalancer.server.port=8080"
      - "traefik.http.routers.infotech-mail-web.service=infotech-mail"
      - "traefik.http.routers.infotech-mail-websecure.service=infotech-mail"
    networks:
      - dokploy-network

  mail-router-edge:
    build: ./mail-router
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      EDGE_TAILSCALE_IP: ${EDGE_TAILSCALE_IP:-100.109.45.89}
      OFFICE_TAILSCALE_IP: ${OFFICE_TAILSCALE_IP:-100.122.253.42}
      EDGE_TUNNEL_IP: ${EDGE_TUNNEL_IP:-10.254.254.1}
      OFFICE_TUNNEL_IP: ${OFFICE_TUNNEL_IP:-10.254.254.2}
      MAILCOW_NETWORK: ${MAILCOW_NETWORK:-192.168.80.0/24}
      PUBLIC_INTERFACE: ${PUBLIC_INTERFACE:-ens3}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_PEER_PUBLIC_KEY: ${WIREGUARD_PEER_PUBLIC_KEY:-}
      WIREGUARD_PORT: ${WIREGUARD_PORT:-51821}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ip link show mailcow-edge >/dev/null &&
          ping -c 1 -W 2 "$${OFFICE_TUNNEL_IP}" >/dev/null &&
          iptables -t nat -C PREROUTING -i "$${PUBLIC_INTERFACE}" -p tcp -m multiport --dports 25,110,143,465,587,993,995,4190 -j INFOTECH_MAIL_IN &&
          iptables -t nat -C POSTROUTING -s "$${OFFICE_TUNNEL_IP}" -o "$${PUBLIC_INTERFACE}" -p tcp --dport 25 -j MASQUERADE
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dokploy-network:
    external: true
